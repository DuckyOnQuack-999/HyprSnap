<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyprSnap - Modern Screen Capture</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <header class="glass-effect p-4 mb-8">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-camera text-3xl text-white"></i>
                <h1 class="text-2xl font-bold text-white">HyprSnap</h1>
            </div>
            <div class="flex items-center space-x-4">
                <div id="status-indicator" class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-green-400 rounded-full" id="status-dot"></div>
                    <span class="text-white text-sm" id="status-text">Ready</span>
                </div>
                <button id="settings-btn" class="text-white hover:text-gray-200">
                    <i class="fas fa-cog text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4">
        <!-- Quick Actions -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Screenshot Card -->
            <div class="glass-effect rounded-lg p-6 card-hover">
                <div class="text-center">
                    <i class="fas fa-camera text-4xl text-white mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-4">Screenshot</h3>
                    <div class="space-y-2">
                        <button id="screenshot-full" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded transition">
                            <i class="fas fa-desktop mr-2"></i>Full Screen
                        </button>
                        <button id="screenshot-area" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded transition">
                            <i class="fas fa-crop mr-2"></i>Select Area
                        </button>
                        <button id="screenshot-window" class="w-full bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded transition">
                            <i class="fas fa-window-maximize mr-2"></i>Active Window
                        </button>
                    </div>
                </div>
            </div>

            <!-- Recording Card -->
            <div class="glass-effect rounded-lg p-6 card-hover">
                <div class="text-center">
                    <i class="fas fa-video text-4xl text-white mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-4">Recording</h3>
                    <div class="space-y-2">
                        <button id="record-start" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded transition">
                            <i class="fas fa-play mr-2"></i>Start Recording
                        </button>
                        <button id="record-stop" class="w-full bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded transition" disabled>
                            <i class="fas fa-stop mr-2"></i>Stop Recording
                        </button>
                        <div class="text-white text-sm">
                            <label class="flex items-center">
                                <input type="checkbox" id="record-audio" class="mr-2">
                                Include Audio
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Card -->
            <div class="glass-effect rounded-lg p-6 card-hover">
                <div class="text-center">
                    <i class="fas fa-sliders-h text-4xl text-white mb-4"></i>
                    <h3 class="text-xl font-semibold text-white mb-4">Settings</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-white text-sm">Quality</label>
                            <input type="range" id="quality-slider" min="1" max="100" value="80" class="w-full">
                            <span class="text-white text-xs" id="quality-value">80</span>
                        </div>
                        <div>
                            <label class="text-white text-sm">FPS</label>
                            <input type="range" id="fps-slider" min="1" max="60" value="15" class="w-full">
                            <span class="text-white text-xs" id="fps-value">15</span>
                        </div>
                        <div>
                            <label class="text-white text-sm">Format</label>
                            <select id="format-select" class="w-full rounded px-2 py-1">
                                <option value="png">PNG</option>
                                <option value="jpg">JPG</option>
                                <option value="webp">WebP</option>
                                <option value="gif">GIF</option>
                                <option value="mp4">MP4</option>
                                <option value="webm">WebM</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Files Section -->
        <div class="glass-effect rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-white">
                    <i class="fas fa-folder mr-2"></i>Recent Captures
                </h3>
                <button id="refresh-files" class="text-white hover:text-gray-200">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div id="files-list" class="space-y-2">
                <!-- Files will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2">
        <!-- Toasts will be added here -->
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="glass-effect rounded-lg p-6 w-full max-w-md">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-semibold text-white">Settings</h3>
                    <button id="close-settings" class="text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-white text-sm">Save Directory</label>
                        <input type="text" id="save-dir" class="w-full rounded px-3 py-2 bg-white bg-opacity-20 text-white placeholder-gray-300" placeholder="~/Pictures/HyprSnap">
                    </div>
                    <div>
                        <label class="text-white text-sm">Default Quality</label>
                        <input type="range" id="default-quality" min="1" max="100" value="80" class="w-full">
                        <span class="text-white text-xs" id="default-quality-value">80</span>
                    </div>
                    <div>
                        <label class="text-white text-sm">Default FPS</label>
                        <input type="range" id="default-fps" min="1" max="60" value="15" class="w-full">
                        <span class="text-white text-xs" id="default-fps-value">15</span>
                    </div>
                    <div class="flex space-x-2">
                        <button id="save-settings" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">
                            Save
                        </button>
                        <button id="cancel-settings" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
